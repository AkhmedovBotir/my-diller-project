services:
  postgres:
    image: postgres:17-alpine
    container_name: diller-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diller"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
